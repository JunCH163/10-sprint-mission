name: CD Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: discodeit-app
  ECR_PUBLIC_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image-meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.ECR_PUBLIC_REGION }}

      - name: Login to Amazon ECR Public
        run: |
          ECR_PUBLIC_REGISTRY=$(echo "$ECR_REPOSITORY_URI" | cut -d/ -f1-2)
          aws ecr-public get-login-password --region "$ECR_PUBLIC_REGION" | docker login --username AWS --password-stdin "$ECR_PUBLIC_REGISTRY"

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY_URI:latest" -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .

      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REPOSITORY_URI:latest"
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"

      - name: Set image metadata
        id: image-meta
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  update-ecs-service:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials for ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition
        run: |
          jq --arg IMAGE "${{ needs.build-and-push.outputs.image }}" \
             --arg CONTAINER_NAME "$ECS_CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == $CONTAINER_NAME
                then .image = $IMAGE
                else .
                end
              )
          ' task-definition.json > task-definition-rendered.json

      - name: Scale down existing service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Wait until all running tasks are stopped
        run: |
          for i in $(seq 1 30); do
            RUNNING_TASK_COUNT=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status RUNNING \
              --query 'length(taskArns)' \
              --output text)

            if [ "$RUNNING_TASK_COUNT" = "0" ]; then
              echo "No running tasks remain."
              exit 0
            fi

            echo "Waiting for running tasks to stop. Current count: $RUNNING_TASK_COUNT"
            sleep 10
          done

          echo "Timed out waiting for running tasks to stop."
          exit 1

      - name: Register new task definition
        id: register-task
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --desired-count 1

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
